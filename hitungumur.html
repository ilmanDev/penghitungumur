<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .lang {
            text-align: right;
            margin-bottom: 10px;
        }

        select {
            padding: 6px;
            border-radius: 6px;
        }

        .icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }

        h1 {
            margin: 5px 0;
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .illustration {
            width: 100%;
            max-width: 180px;
            margin: 0 auto 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            animation: slideUp 0.5s ease;
        }

        footer {
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            opacity: 0.9;
        }

        footer i {
            color: #ff6b6b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="lang">
        <select id="language" onchange="changeLanguage()">
            <option value="id">🇮🇩 ID</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="icon">
        <i class="fa-solid fa-cake-candles"></i>
    </div>

    <img class="illustration" src="https://www.svgrepo.com/show/493624/birthday-cake.svg" alt="Birthday">

    <h1 id="title">Hitung Umur</h1>
    <p id="subtitle">Masukkan tanggal lahir Anda</p>

    <input type="date" id="birthDate">
    <button onclick="hitungUmur()" id="btn">Hitung Umur</button>

    <div class="result" id="result"></div>
</div>

<footer>
    © 2026 <strong>By. Ilman</strong>  
    <br>
    Made with <i class="fa-solid fa-heart"></i> & <i class="fa-solid fa-globe"></i>
</footer>

<script>
    const text = {
        id: {
            title: "Hitung Umur",
            subtitle: "Masukkan tanggal lahir Anda",
            button: "Hitung Umur",
            error: "Silakan pilih tanggal lahir!",
            result: "Umur Anda"
        },
        en: {
            title: "Age Calculator",
            subtitle: "Enter your birth date",
            button: "Calculate Age",
            error: "Please select your birth date!",
            result: "Your Age"
        }
    };

    function changeLanguage() {
        const lang = document.getElementById("language").value;
        document.getElementById("title").innerText = text[lang].title;
        document.getElementById("subtitle").innerText = text[lang].subtitle;
        document.getElementById("btn").innerText = text[lang].button;
        document.getElementById("result").innerHTML = "";
    }

    function hitungUmur() {
        const lang = document.getElementById("language").value;
        const birthDate = new Date(document.getElementById("birthDate").value);
        const today = new Date();

        if (isNaN(birthDate)) {
            document.getElementById("result").innerHTML = text[lang].error;
            return;
        }

        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById("result").innerHTML =
            `${text[lang].result}: <br>${years} Years, ${months} Months, ${days} Days`;
    }
</script>

</body>
</html>
